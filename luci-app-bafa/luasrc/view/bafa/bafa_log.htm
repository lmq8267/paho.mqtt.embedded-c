<%
local dsp = require "luci.dispatcher"
-%>
<style type="text/css">
	#_log_fieldset {
		border: 0;
		margin: 0;
		padding: 0;
		background: none;
		min-width: 0;
	}

	.bafa-log-wrap {
		display: flex;
		flex-direction: column;
		gap: 14px;
	}

	/* 玻璃质感通用类 */
	.bafa-glass {
		position: relative;
		background: rgba(255, 255, 255, 0.55);
		-webkit-backdrop-filter: blur(20px) saturate(180%);
		backdrop-filter: blur(20px) saturate(180%);
		border: 1px solid rgba(255, 255, 255, 0.65);
		box-shadow: 0 8px 32px rgba(31, 38, 135, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.75);
	}

	/* 顶部工具栏 */
	.bafa-log-bar {
		display: flex;
		align-items: center;
		justify-content: space-between;
		flex-wrap: wrap;
		gap: 12px;
		padding: 12px 16px;
		border-radius: 18px;
	}

	/* 自动刷新开关 */
	.bafa-switch {
		display: inline-flex;
		align-items: center;
		gap: 10px;
		cursor: pointer;
		-webkit-user-select: none;
		user-select: none;
		font-size: 14px;
		color: #1c1c1e;
		line-height: 1;
	}

	.bafa-switch input {
		position: absolute;
		width: 1px;
		height: 1px;
		opacity: 0;
		margin: 0;
		pointer-events: none;
	}

	.bafa-slider {
		position: relative;
		flex: 0 0 auto;
		width: 46px;
		height: 26px;
		border-radius: 999px;
		background: rgba(120, 120, 128, 0.32);
		border: 1px solid rgba(255, 255, 255, 0.55);
		box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12);
		transition: background 0.3s ease;
	}

	.bafa-slider::before {
		content: "";
		position: absolute;
		top: 2px;
		left: 2px;
		width: 20px;
		height: 20px;
		border-radius: 50%;
		background: #fff;
		box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
		transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
	}

	.bafa-switch input:checked + .bafa-slider {
		background: rgba(48, 209, 88, 0.9);
	}

	.bafa-switch input:checked + .bafa-slider::before {
		transform: translateX(20px);
	}

	.bafa-switch input:focus-visible + .bafa-slider {
		outline: 2px solid rgba(10, 132, 255, 0.8);
		outline-offset: 2px;
	}

	/* 按钮 */
	.bafa-btn {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		gap: 8px;
		padding: 9px 18px;
		border-radius: 14px;
		border: 1px solid rgba(255, 255, 255, 0.6);
		background: rgba(255, 255, 255, 0.45);
		color: #1c1c1e;
		font-size: 14px;
		font-weight: 500;
		line-height: 1;
		cursor: pointer;
		-webkit-backdrop-filter: blur(12px) saturate(160%);
		backdrop-filter: blur(12px) saturate(160%);
		-webkit-tap-highlight-color: transparent;
		transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease, background 0.25s ease, opacity 0.2s ease;
	}

	.bafa-btn:hover {
		transform: translateY(-1px);
		box-shadow: 0 6px 18px rgba(31, 38, 135, 0.18);
	}

	.bafa-btn:active {
		transform: translateY(0) scale(0.97);
	}

	.bafa-btn:focus-visible {
		outline: 2px solid rgba(10, 132, 255, 0.8);
		outline-offset: 2px;
	}

	.bafa-btn-danger {
		color: #c0392b;
		border-color: rgba(255, 90, 90, 0.4);
		background: rgba(255, 235, 235, 0.55);
	}

	.bafa-btn-danger:hover {
		box-shadow: 0 6px 18px rgba(192, 57, 43, 0.22);
	}

	/* 加载 / 冷却中状态 */
	.bafa-btn[disabled],
	.bafa-btn.is-loading {
		cursor: not-allowed;
		opacity: 0.55;
		filter: grayscale(0.35);
		transform: none;
		box-shadow: none;
	}

	.bafa-btn-icon {
		width: 16px;
		height: 16px;
		flex: 0 0 auto;
	}

	.bafa-btn-spinner {
		display: none;
		width: 14px;
		height: 14px;
		flex: 0 0 auto;
		border-radius: 50%;
		border: 2px solid rgba(192, 57, 43, 0.25);
		border-top-color: #c0392b;
		animation: bafa-spin 0.7s linear infinite;
	}

	.bafa-btn.is-loading .bafa-btn-spinner {
		display: inline-block;
	}

	.bafa-btn.is-loading .bafa-btn-icon {
		display: none;
	}

	@keyframes bafa-spin {
		to {
			transform: rotate(360deg);
		}
	}

	/* 日志内容：代码块背景 */
	.bafa-log-box {
		padding: 0;
		border-radius: 16px;
		overflow: hidden;
		background: #1e1e24;
		border: 1px solid rgba(255, 255, 255, 0.12);
		box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
	}

	/* 代码块顶部窗口栏 */
	.bafa-code-head {
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 9px 14px;
		background: rgba(255, 255, 255, 0.06);
		border-bottom: 1px solid rgba(255, 255, 255, 0.08);
	}

	.bafa-code-dot {
		width: 11px;
		height: 11px;
		flex: 0 0 auto;
		border-radius: 50%;
	}

	.bafa-code-dot.red {
		background: #ff5f57;
	}

	.bafa-code-dot.yellow {
		background: #febc2e;
	}

	.bafa-code-dot.green {
		background: #28c840;
	}

	.bafa-code-title {
		margin-left: 6px;
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
		font-size: 12px;
		letter-spacing: 0.3px;
		color: rgba(255, 255, 255, 0.55);
	}

	#log_textarea {
		display: block;
		width: 100%;
		box-sizing: border-box;
		margin: 0;
		padding: 14px 16px;
		height: 62vh;
		min-height: 300px;
		border: 0;
		border-radius: 0;
		background: transparent;
		color: #d4d4d4;
		font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
		font-size: 13px;
		line-height: 1.6;
		resize: none;
		outline: none;
		transition: box-shadow 0.25s ease;
	}

	#log_textarea:focus {
		box-shadow: inset 0 0 0 2px rgba(10, 132, 255, 0.35);
	}

	/* 移动端：紧凑布局 + 输入框字号 >=16px 防止聚焦自动缩放 */
	@media (max-width: 600px) {
		.bafa-log-bar {
			padding: 10px 12px;
			gap: 10px;
		}

		.bafa-btn {
			padding: 8px 14px;
			font-size: 13px;
		}

		#log_textarea {
			height: 56vh;
			min-height: 220px;
			font-size: 16px;
			line-height: 1.5;
			padding: 12px;
		}
	}

	/* 暗黑模式 */
	@media (prefers-color-scheme: dark) {
		.bafa-glass {
			background: rgba(28, 28, 32, 0.5);
			border-color: rgba(255, 255, 255, 0.12);
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
		}

		.bafa-switch {
			color: #f2f2f7;
		}

		.bafa-slider {
			background: rgba(120, 120, 128, 0.4);
			border-color: rgba(255, 255, 255, 0.15);
		}

		.bafa-btn {
			color: #f2f2f7;
			background: rgba(255, 255, 255, 0.08);
			border-color: rgba(255, 255, 255, 0.14);
		}

		.bafa-btn-danger {
			color: #ff6b6b;
			background: rgba(255, 90, 90, 0.12);
			border-color: rgba(255, 90, 90, 0.3);
		}

		.bafa-btn-spinner {
			border-color: rgba(255, 107, 107, 0.25);
			border-top-color: #ff6b6b;
		}
	}
</style>

<script type="text/javascript">
	//<![CDATA[
	// 切换按钮的加载 / 冷却状态，防止重复点击
	function bafaSetLoading(btn, on) {
		if (!btn) return;
		if (on) {
			btn.classList.add('is-loading');
			btn.disabled = true;
		} else {
			btn.classList.remove('is-loading');
			btn.disabled = false;
		}
	}

	function clearlog(btn) {
		// 已在请求中（冷却中）直接忽略，避免重复提交
		if (!btn || btn.disabled) return;
		bafaSetLoading(btn, true);
		var finished = false;
		// 超时 / 无网络保护：8 秒后无论是否收到响应都恢复按钮，避免一直卡在加载态
		var watchdog = setTimeout(function () {
			if (finished) return;
			finished = true;
			bafaSetLoading(btn, false);
		}, 8000);

		XHR.get('<%=dsp.build_url("admin/services/bafa/clear_log")%>', null,
			function (x, data) {
				if (finished) return;
				finished = true;
				clearTimeout(watchdog);
				if (x && x.status == 200) {
					var log_textarea = document.getElementById('log_textarea');
					if (log_textarea) {
						log_textarea.value = "";
						log_textarea.scrollTop = log_textarea.scrollHeight;
					}
				}
				bafaSetLoading(btn, false);
			}
		);
	}

	XHR.poll(2, '<%=dsp.build_url("admin/services/bafa/get_log")%>', null,
		function (x, data) {
			var cb = document.getElementById("checkbox1");
			if (x && x.status == 200 && cb && cb.checked) {
				var log_textarea = document.getElementById('log_textarea');
				if (log_textarea) {
					log_textarea.value = x.responseText;
					log_textarea.scrollTop = log_textarea.scrollHeight;
				}
			}
		}
	);
	//]]>
</script>

<fieldset class="cbi-section" id="_log_fieldset">
	<div class="bafa-log-wrap">
		<div class="bafa-log-bar bafa-glass">
			<label class="bafa-switch">
				<input type="checkbox" id="checkbox1" checked="checked" />
				<span class="bafa-slider"></span>
				<span><%:自动刷新%></span>
			</label>
			<button id="bafa_clear_btn" class="bafa-btn bafa-btn-danger" type="button" onclick="clearlog(this)">
				<span class="bafa-btn-spinner" aria-hidden="true"></span>
				<svg class="bafa-btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M3 6h18" />
					<path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
					<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
					<path d="M10 11v6M14 11v6" />
				</svg>
				<span class="bafa-btn-text"><%:清除日志%></span>
			</button>
		</div>
		<div class="bafa-log-box">
			<div class="bafa-code-head">
				<span class="bafa-code-dot red"></span>
				<span class="bafa-code-dot yellow"></span>
				<span class="bafa-code-dot green"></span>
				<span class="bafa-code-title">/var/log/bafa.log</span>
			</div>
			<textarea id="log_textarea" class="cbi-input-textarea" data-update="change" rows="30" wrap="off" readonly="readonly"></textarea>
		</div>
	</div>
</fieldset>
